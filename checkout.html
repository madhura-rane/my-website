<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - LoopWhimsy</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        .checkout-card {
            border-radius: 15px;
        }

        .checkout-product {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .checkout-product img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
        }

        .place-order-btn {
            border-radius: 10px;
            padding: 12px;
            font-size: 17px;
        }

        #successScreen {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.97);
            z-index: 9998;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 90px;
        }

        @keyframes bounce {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

        }

        .checkout-section {
            padding-top: 35px !important;
            padding-bottom: 35px !important;
        }

        .customer-card {
            margin-bottom: 20px !important;
        }

        .summary-card {
            margin-top: 0 !important;
        }

        @media (max-width: 576px) {

            .checkout-product img {
                width: 65px;
                height: 65px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center"
            href="index.html">

            <img
                src="images/logo.jpeg"
                alt="LoopWhimsy Logo"
                width="50"
                height="50"
                class="me-2">

            <span class="fw-bold text-danger">
                LoopWhimsy
            </span>

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="contact.html">
                        Contact
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="admin-login.html">
                        Admin Login 🔐
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link active"
                        href="cart.html">
                        Cart 🛒
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =====================================================
     CHECKOUT
     ===================================================== -->

<section class="container checkout-section">

    <h2 class="text-center mb-4">
        Checkout 🛍️
    </h2>


    <div class="row justify-content-center">

        <div class="col-12 col-lg-8">


            <!-- CUSTOMER DETAILS -->

            <div
                class="card shadow-sm checkout-card p-4 customer-card">

                <h4 class="mb-4">
                    Customer Details 👤
                </h4>


                <form id="checkout-form">

                    <div class="mb-3">

                        <label
                            for="customerName"
                            class="form-label fw-bold">

                            Full Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="customerName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="customerPhone"
                            class="form-label fw-bold">

                            Mobile Number

                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            id="customerPhone"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            inputmode="numeric"
                            autocomplete="tel"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="customerAddress"
                            class="form-label fw-bold">

                            Address

                        </label>

                        <textarea
                            class="form-control"
                            id="customerAddress"
                            rows="3"
                            placeholder="Enter your complete address"
                            autocomplete="street-address"
                            required></textarea>

                    </div>


                    <div class="mb-3">

                        <label
                            for="customerCity"
                            class="form-label fw-bold">

                            City

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="customerCity"
                            placeholder="Enter your city"
                            autocomplete="address-level2"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="customerPincode"
                            class="form-label fw-bold">

                            Pincode

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="customerPincode"
                            placeholder="Enter 6-digit pincode"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                            autocomplete="postal-code"
                            required>

                    </div>

                </form>

            </div>


            <!-- ORDER SUMMARY -->

            <div
                class="card shadow-sm checkout-card p-4 summary-card">

                <h4 class="mb-4">
                    Order Summary 🛒
                </h4>


                <div id="checkout-items">

                    <p class="text-center text-muted">
                        Loading cart...
                    </p>

                </div>


                <hr>


                <div
                    class="d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">
                        Total Amount
                    </h5>

                    <h5
                        id="checkout-total"
                        class="text-danger fw-bold mb-0">

                        ₹0

                    </h5>

                </div>


                <button
                    id="placeOrderButton"
                    type="submit"
                    form="checkout-form"
                    class="btn btn-danger w-100 mt-4 place-order-btn">

                    Place Order 🛍️

                </button>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     SUCCESS SCREEN
     ===================================================== -->

<div id="successScreen">

    <div>

        <div
            class="success-icon"
            style="animation:bounce 0.8s infinite;">

            🎉

        </div>


        <h1 class="text-danger fw-bold">
            Order Placed!
        </h1>


        <h4 class="mt-3">
            Your order has been placed successfully 🎊
        </h4>


        <p class="text-muted mt-3">
            Thank you for shopping with LoopWhimsy ❤️
        </p>


        <p
            id="successOrderNumber"
            class="fw-bold text-danger">
        </p>


        <button
            type="button"
            onclick="window.location.href='index.html'"
            class="btn btn-danger mt-3">

            Continue Shopping 🛍️

        </button>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     CHECKOUT JAVASCRIPT
     ===================================================== -->

<script>

"use strict";


const checkoutItems =
    document.getElementById("checkout-items");

const checkoutTotal =
    document.getElementById("checkout-total");

const placeOrderButton =
    document.getElementById("placeOrderButton");

const checkoutForm =
    document.getElementById("checkout-form");

const successScreen =
    document.getElementById("successScreen");

const successOrderNumber =
    document.getElementById("successOrderNumber");


let cart = [];


/* =====================================================
   LOAD CART
   ===================================================== */

function loadCart() {

    try {

        const savedCart =
            localStorage.getItem("cart");

        if (!savedCart) {

            cart = [];
            return;

        }

        const parsedCart =
            JSON.parse(savedCart);

        if (Array.isArray(parsedCart)) {

            cart = parsedCart;

        } else {

            cart = [];

        }

    } catch (error) {

        console.error(
            "Cart loading error:",
            error
        );

        cart = [];

    }

}


/* =====================================================
   DISPLAY CHECKOUT CART
   ===================================================== */

function displayCheckoutCart() {

    if (!checkoutItems) {
        return;
    }


    if (cart.length === 0) {

        checkoutItems.innerHTML = `

            <div class="text-center py-4">

                <div style="font-size:50px;">
                    🛒
                </div>

                <h5 class="mt-3">
                    Your cart is empty
                </h5>

                <a
                    href="products.html"
                    class="btn btn-danger mt-3">

                    Browse Products

                </a>

            </div>

        `;

        checkoutTotal.textContent = "₹0";

        placeOrderButton.disabled = true;

        return;

    }


    checkoutItems.innerHTML = "";

    let total = 0;


    cart.forEach(function(product) {

        const price =
            Number(product.price) || 0;

        const quantity =
            Math.max(
                1,
                Number(product.quantity) || 1
            );

        const itemTotal =
            price * quantity;

        total += itemTotal;


        const productName =
            String(product.name || "Product");

        const productImage =
            String(product.image || "");


        checkoutItems.innerHTML += `

            <div class="checkout-product
                        d-flex
                        align-items-center">

                <img
                    src="${productImage}"
                    alt="${productName}"
                    class="me-3">

                <div>

                    <h6 class="mb-1">
                        ${productName}
                    </h6>

                    <small class="text-muted">
                        Quantity: ${quantity}
                    </small>

                    <div
                        class="text-danger
                               fw-bold
                               mt-1">

                        ₹${price}

                    </div>

                </div>

                <div class="ms-auto fw-bold">

                    ₹${itemTotal}

                </div>

            </div>

        `;

    });


    checkoutTotal.textContent =
        "₹" + total;

    placeOrderButton.disabled = false;

}


/* =====================================================
   PLACE ORDER
   ===================================================== */

checkoutForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        loadCart();


        if (cart.length === 0) {

            alert("Your cart is empty!");

            return;

        }


        const name =
            document
                .getElementById("customerName")
                .value
                .trim();

        const phone =
            document
                .getElementById("customerPhone")
                .value
                .trim();

        const address =
            document
                .getElementById("customerAddress")
                .value
                .trim();

        const city =
            document
                .getElementById("customerCity")
                .value
                .trim();

        const pincode =
            document
                .getElementById("customerPincode")
                .value
                .trim();


        /* VALIDATION */

        if (!name) {

            alert("Please enter your full name.");
            return;

        }


        if (!/^[0-9]{10}$/.test(phone)) {

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        if (!address) {

            alert("Please enter your address.");
            return;

        }


        if (!city) {

            alert("Please enter your city.");
            return;

        }


        if (!/^[0-9]{6}$/.test(pincode)) {

            alert(
                "Please enter a valid 6-digit pincode."
            );

            return;

        }


        /* CALCULATE TOTAL */

        let total = 0;

        cart.forEach(function(product) {

            const price =
                Number(product.price) || 0;

            const quantity =
                Math.max(
                    1,
                    Number(product.quantity) || 1
                );

            total += price * quantity;

        });


        /* LOAD OLD ORDERS */

        let allOrders = [];


        try {

            const savedOrders =
                localStorage.getItem("allOrders");

            if (savedOrders) {

                const parsedOrders =
                    JSON.parse(savedOrders);

                if (Array.isArray(parsedOrders)) {

                    allOrders = parsedOrders;

                }

            }

        } catch (error) {

            console.error(
                "Order loading error:",
                error
            );

            allOrders = [];

        }


        /* CREATE NEW ORDER */

        const orderNumber =
            allOrders.length + 1;


        const newOrder = {

            customerName: name,

            phone: phone,

            address: address,

            city: city,

            pincode: pincode,

            orderDate: new Date().toLocaleString(),

            status: "Pending",

            total: total,

            products: cart.map(function(product) {

                return {

                    id: String(product.id || ""),

                    name: String(
                        product.name || "Product"
                    ),

                    image: String(
                        product.image || ""
                    ),

                    price:
                        Number(product.price) || 0,

                    quantity:
                        Math.max(
                            1,
                            Number(product.quantity) || 1
                        )

                };

            })

        };


        /* SAVE ORDER */

        allOrders.push(newOrder);


        try {

            localStorage.setItem(
                "allOrders",
                JSON.stringify(allOrders)
            );

            localStorage.setItem(
                "latestOrder",
                JSON.stringify(newOrder)
            );

        } catch (error) {

            console.error(
                "Order saving error:",
                error
            );

            alert(
                "Unable to save order. Please try again."
            );

            return;

        }


        /* CLEAR CART */

        localStorage.removeItem("cart");

        cart = [];


        /* SHOW SUCCESS */

        successOrderNumber.textContent =
            "Order #" + orderNumber;


        successScreen.style.display =
            "flex";


        placeOrderButton.disabled =
            true;

    }
);


/* =====================================================
   START CHECKOUT
   ===================================================== */

loadCart();

displayCheckoutCart();

</script>

</body>

</html>
