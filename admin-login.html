<!-- =====================================================
     ADMIN LOGIN
     ===================================================== -->

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-6 col-lg-5">


            <div class="card shadow border-0 p-4 login-card">


                <!-- LOGIN HEADING -->

                <div class="text-center mb-4">


                    <div
                        style="font-size: 50px;">

                        🔐

                    </div>


                    <h2 class="text-danger">

                        Admin Login

                    </h2>


                    <p class="text-muted">

                        Login to manage LoopWhimsy orders

                    </p>

                </div>



                <!-- =================================================
                     LOGIN FORM
                     ================================================= -->

                <form
                    id="adminLoginForm"
                    autocomplete="off">


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label
                            for="adminUsername"
                            class="form-label fw-bold">

                            Username

                        </label>


                        <input
                            type="text"
                            id="adminUsername"
                            name="adminUsername"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                            required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label
                            for="adminPassword"
                            class="form-label fw-bold">

                            Password

                        </label>


                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="new-password"
                            required>

                    </div>



                    <!-- ERROR MESSAGE -->

                    <div
                        id="loginError"
                        class="text-danger text-center mb-3">

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-danger w-100 login-button">

                        Login 🔐

                    </button>


                </form>


            </div>

        </div>

    </div>

</section>

<!-- =====================================================
     LOGIN JAVASCRIPT
     ===================================================== -->

<script>

"use strict";


/* =====================================================
   GET ELEMENTS
   ===================================================== */

const adminLoginForm =
    document.getElementById("adminLoginForm");


const adminUsername =
    document.getElementById("adminUsername");


const adminPassword =
    document.getElementById("adminPassword");


const loginError =
    document.getElementById("loginError");



/* =====================================================
   CLEAR LOGIN FIELDS
   ===================================================== */

/*
   This makes sure username and password
   are empty whenever the login page opens.
*/

function clearLoginFields() {

    adminUsername.value = "";

    adminPassword.value = "";

    loginError.textContent = "";

}


/* Run when page opens */

clearLoginFields();


/* Run when page is restored from browser cache */

window.addEventListener(
    "pageshow",
    function() {

        clearLoginFields();

    }
);



/* =====================================================
   LOGIN
   ===================================================== */

adminLoginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const username =
            adminUsername.value.trim();


        const password =
            adminPassword.value;



        /* =============================================
           ADMIN LOGIN DETAILS

           Username: admin
           Password: admin123
           ============================================= */


        if (
            username === "admin" &&
            password === "admin123"
        ) {


            /* Save login status */

            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            /* Open admin dashboard */

            window.location.href =
                "admin.html";


        }
        else {


            /* Wrong login */

            loginError.textContent =
                "Invalid username or password ❌";


            /* Clear password */

            adminPassword.value = "";


            /* Keep username for correction */

            adminPassword.focus();

        }

    }
);

</script>
