
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - LoopWhimsy</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">


    <style>

        .dashboard-card {
            min-height: 160px;
            border-radius: 15px;
            transition: 0.3s;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
        }

        .dashboard-icon {
            font-size: 40px;
        }

        .order-card {
            border-radius: 15px;
            height: 100%;
            transition: 0.3s;
        }

        .order-card:hover {
            transform: translateY(-4px);
        }

        .product-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .search-box {
            border-radius: 10px;
            padding: 12px 15px;
        }

        .customer-details p {
            margin-bottom: 8px;
            word-break: break-word;
        }

        .product-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .total-box {
            border-top: 1px solid #ddd;
            margin-top: 15px;
            padding-top: 15px;
        }

        .order-status {
            border-radius: 10px;
        }

        .empty-orders {
            border-radius: 15px;
        }

        @media (max-width: 576px) {

            .product-image {
                width: 60px;
                height: 60px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">

    <div class="container">


        <a
            class="navbar-brand d-flex align-items-center"
            href="index.html">

            <img
                src="images/logo.jpeg"
                alt="LoopWhimsy Logo"
                width="50"
                height="50"
                class="me-2">

            <span class="fw-bold text-danger">

                LoopWhimsy

            </span>

        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html">

                        Home

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="products.html">

                        Products

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="about.html">

                        About

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="contact.html">

                        Contact

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="admin-login.html">

                        Admin Login 🔐

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="cart.html">

                        Cart 🛒

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- =====================================================
     MAIN DASHBOARD
===================================================== -->

<main class="container py-5">


    <h2 class="text-center mb-5">

        Admin Dashboard 📊

    </h2>



    <!-- =================================================
         DASHBOARD COUNTS
    ================================================== -->

    <div class="row g-4 mb-5">


        <!-- TOTAL ORDERS -->

        <div class="col-12 col-sm-6 col-lg-3">

            <div
                class="card shadow-sm text-center p-4 h-100 dashboard-card">

                <div class="dashboard-icon">

                    📦

                </div>


                <h6 class="text-muted mt-3">

                    Total Orders

                </h6>


                <h2
                    id="totalOrders"
                    class="fw-bold">

                    0

                </h2>

            </div>

        </div>



        <!-- PENDING -->

        <div class="col-12 col-sm-6 col-lg-3">

            <div
                class="card shadow-sm text-center p-4 h-100 dashboard-card">

                <div class="dashboard-icon">

                    ⏳

                </div>


                <h6 class="text-muted mt-3">

                    Pending

                </h6>


                <h2
                    id="pendingOrders"
                    class="fw-bold text-warning">

                    0

                </h2>

            </div>

        </div>



        <!-- SHIPPED -->

        <div class="col-12 col-sm-6 col-lg-3">

            <div
                class="card shadow-sm text-center p-4 h-100 dashboard-card">

                <div class="dashboard-icon">

                    🚚

                </div>


                <h6 class="text-muted mt-3">

                    Shipped

                </h6>


                <h2
                    id="shippedOrders"
                    class="fw-bold text-primary">

                    0

                </h2>

            </div>

        </div>



        <!-- DELIVERED -->

        <div class="col-12 col-sm-6 col-lg-3">

            <div
                class="card shadow-sm text-center p-4 h-100 dashboard-card">

                <div class="dashboard-icon">

                    ✅

                </div>


                <h6 class="text-muted mt-3">

                    Delivered

                </h6>


                <h2
                    id="deliveredOrders"
                    class="fw-bold text-success">

                    0

                </h2>

            </div>

        </div>

    </div>



    <!-- =================================================
         SEARCH
    ================================================== -->

    <div class="card shadow-sm p-4 mb-5">

        <h4 class="mb-3">

            🔎 Search Orders

        </h4>


        <input
            type="search"
            id="searchOrders"
            class="form-control search-box"
            placeholder="Search name, mobile, city, pincode, product or order number..."
            autocomplete="off">


        <small class="text-muted d-block mt-2">

            Search automatically while typing.

        </small>

    </div>



    <!-- =================================================
         ORDERS HEADING
    ================================================== -->

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4
               flex-wrap
               gap-2">

        <h3 class="mb-0">

            All Orders 📦

        </h3>


        <span
            id="resultCount"
            class="badge bg-secondary">

            0 Orders

        </span>

    </div>



    <!-- =================================================
         ORDERS GRID
    ================================================== -->

    <div
        id="admin-orders"
        class="row g-4">

    </div>


</main>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script>

"use strict";


/* =====================================================
   STORAGE KEYS
===================================================== */

const STORAGE_KEY = "allOrders";
const LEGACY_KEY = "latestOrder";


/* =====================================================
   VALID STATUSES
===================================================== */

const VALID_STATUSES = [
    "Pending",
    "Confirmed",
    "Shipped",
    "Delivered"
];


/* =====================================================
   GET ELEMENTS
===================================================== */

const ordersContainer =
    document.getElementById("admin-orders");

const totalOrders =
    document.getElementById("totalOrders");

const pendingOrders =
    document.getElementById("pendingOrders");

const shippedOrders =
    document.getElementById("shippedOrders");

const deliveredOrders =
    document.getElementById("deliveredOrders");

const searchInput =
    document.getElementById("searchOrders");

const resultCount =
    document.getElementById("resultCount");


/* =====================================================
   ALL ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   SAFE STRING
===================================================== */

function safeString(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value);
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return safeString(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   NORMALIZE STATUS
===================================================== */

function normalizeStatus(status) {

    if (
        VALID_STATUSES.includes(status)
    ) {
        return status;
    }

    return "Pending";

}


/* =====================================================
   NORMALIZE ORDER
===================================================== */

function normalizeOrder(order) {

    const item =
        order &&
        typeof order === "object"
            ? order
            : {};


    item.customerName =
        safeString(item.customerName);

    item.phone =
        safeString(item.phone);

    item.address =
        safeString(item.address);

    item.city =
        safeString(item.city);

    item.pincode =
        safeString(item.pincode);

    item.orderDate =
        safeString(item.orderDate);

    item.status =
        normalizeStatus(item.status);

    item.total =
        Number(item.total) || 0;


    if (!Array.isArray(item.products)) {

        item.products = [];

    }


    item.products =
        item.products.map(function(product) {

            const p =
                product &&
                typeof product === "object"
                    ? product
                    : {};


            return {

                id:
                    safeString(p.id),

                name:
                    safeString(p.name) || "Product",

                image:
                    safeString(p.image),

                price:
                    Number(p.price) || 0,

                quantity:
                    Math.max(
                        1,
                        Number(p.quantity) || 1
                    )

            };

        });


    return item;

}


/* =====================================================
   LOAD ORDERS
===================================================== */

function loadOrders() {

    allOrders = [];


    /* ---------------------------------------------
       FIRST: ALL ORDERS
    --------------------------------------------- */

    try {

        const savedOrders =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (savedOrders) {

            const parsed =
                JSON.parse(savedOrders);


            if (Array.isArray(parsed)) {

                allOrders =
                    parsed.map(
                        normalizeOrder
                    );

            }

        }

    }
    catch (error) {

        console.error(
            "allOrders loading error:",
            error
        );

        allOrders = [];

    }


    /* ---------------------------------------------
       SECOND: LATEST ORDER FALLBACK
    --------------------------------------------- */

    if (allOrders.length === 0) {

        try {

            const latest =
                localStorage.getItem(
                    LEGACY_KEY
                );


            if (latest) {

                const parsedLatest =
                    JSON.parse(latest);


                if (
                    parsedLatest &&
                    typeof parsedLatest === "object"
                ) {

                    allOrders = [
                        normalizeOrder(
                            parsedLatest
                        )
                    ];


                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(allOrders)
                    );

                }

            }

        }
        catch (error) {

            console.error(
                "latestOrder loading error:",
                error
            );

        }

    }


    console.log(
        "ADMIN ORDERS:",
        allOrders
    );

}


/* =====================================================
   SAVE ORDERS
===================================================== */

function saveOrders() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(allOrders)
        );


        if (allOrders.length > 0) {

            localStorage.setItem(
                LEGACY_KEY,
                JSON.stringify(
                    allOrders[
                        allOrders.length - 1
                    ]
                )
            );

        }
        else {

            localStorage.removeItem(
                LEGACY_KEY
            );

        }

    }
    catch (error) {

        console.error(
            "Saving orders error:",
            error
        );

    }

}


/* =====================================================
   UPDATE DASHBOARD
===================================================== */

function updateDashboard() {

    let pending = 0;

    let shipped = 0;

    let delivered = 0;


    allOrders.forEach(function(order) {

        const status =
            normalizeStatus(
                order.status
            );


        if (status === "Pending") {

            pending++;

        }


        if (status === "Shipped") {

            shipped++;

        }


        if (status === "Delivered") {

            delivered++;

        }

    });


    totalOrders.textContent =
        allOrders.length;


    pendingOrders.textContent =
        pending;


    shippedOrders.textContent =
        shipped;


    deliveredOrders.textContent =
        delivered;

}


/* =====================================================
   SEARCH TEXT
===================================================== */

function getSearchText(order, index) {

    let text = [

        order.customerName,

        order.phone,

        order.address,

        order.city,

        order.pincode,

        order.status,

        order.orderDate,

        "order " + (index + 1),

        "#" + (index + 1)

    ].join(" ");


    if (Array.isArray(order.products)) {

        order.products.forEach(function(product) {

            text +=
                " " +
                safeString(product.name);


            text +=
                " " +
                safeString(product.id);

        });

    }


    return text.toLowerCase();

}


/* =====================================================
   BUILD PRODUCTS
===================================================== */

function buildProductsHtml(products) {

    if (
        !Array.isArray(products) ||
        products.length === 0
    ) {

        return `
            <div class="alert alert-light">
                No product information available.
            </div>
        `;

    }


    return products.map(function(product) {

        const price =
            Number(product.price) || 0;


        const quantity =
            Math.max(
                1,
                Number(product.quantity) || 1
            );


        const itemTotal =
            price * quantity;


        const image =
            escapeHtml(
                product.image
            );


        const name =
            escapeHtml(
                product.name || "Product"
            );


        return `

            <div class="product-box">

                <div class="d-flex align-items-center">

                    <img
                        src="${image}"
                        alt="${name}"
                        class="product-image me-3"
                        onerror="this.style.display='none';">

                    <div>

                        <h6 class="mb-1">
                            ${name}
                        </h6>

                        <p class="mb-1">
                            Quantity: ${quantity}
                        </p>

                        <p class="text-danger fw-bold mb-1">
                            ₹${price}
                        </p>

                        <small class="text-muted">
                            Item Total: ₹${itemTotal}
                        </small>

                    </div>

                </div>

            </div>

        `;

    }).join("");

}


/* =====================================================
   BUILD ORDER CARD
===================================================== */

function buildOrderHtml(order, index) {

    const status =
        normalizeStatus(
            order.status
        );


    const productsHTML =
        buildProductsHtml(
            order.products
        );


    return `

        <div class="col-12 col-md-6 col-xl-4">

            <div class="card shadow-sm order-card">

                <div class="card-body">

                    <div class="d-flex
                                justify-content-between
                                align-items-center
                                mb-3">

                        <h4 class="mb-0">
                            Order #${index + 1} 📦
                        </h4>


                        <button
                            type="button"
                            class="btn btn-outline-danger btn-sm delete-order"
                            data-index="${index}"
                            title="Delete Order">

                            🗑️

                        </button>

                    </div>


                    <h5 class="mb-3">
                        Customer Details 👤
                    </h5>


                    <div class="customer-details">

                        <p>
                            <strong>Name:</strong>
                            ${escapeHtml(
                                order.customerName
                            ) || "-"}
                        </p>


                        <p>
                            <strong>Mobile:</strong>
                            ${escapeHtml(
                                order.phone
                            ) || "-"}
                        </p>


                        <p>
                            <strong>Address:</strong>
                            ${escapeHtml(
                                order.address
                            ) || "-"}
                        </p>


                        <p>
                            <strong>City:</strong>
                            ${escapeHtml(
                                order.city
                            ) || "-"}
                        </p>


                        <p>
                            <strong>Pincode:</strong>
                            ${escapeHtml(
                                order.pincode
                            ) || "-"}
                        </p>


                        <p>
                            <strong>Date:</strong>
                            ${escapeHtml(
                                order.orderDate
                            ) || "-"}
                        </p>

                    </div>


                    <div class="mt-3">

                        <label class="form-label fw-bold">
                            Order Status
                        </label>


                        <select
                            class="form-select order-status status-select"
                            data-index="${index}">

                            <option
                                value="Pending"
                                ${status === "Pending" ? "selected" : ""}>

                                Pending

                            </option>


                            <option
                                value="Confirmed"
                                ${status === "Confirmed" ? "selected" : ""}>

                                Confirmed

                            </option>


                            <option
                                value="Shipped"
                                ${status === "Shipped" ? "selected" : ""}>

                                Shipped

                            </option>


                            <option
                                value="Delivered"
                                ${status === "Delivered" ? "selected" : ""}>

                                Delivered

                            </option>

                        </select>

                    </div>


                    <hr>


                    <h5 class="mb-3">
                        Ordered Products 🛍️
                    </h5>


                    ${productsHTML}


                    <div class="total-box text-end">

                        <h4 class="text-danger mb-0">

                            Total:
                            ₹${Number(order.total) || 0}

                        </h4>

                    </div>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders() {

    if (!ordersContainer) {

        return;

    }


    const searchValue =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    let html = "";

    let count = 0;


    allOrders.forEach(function(order, index) {

        const searchableText =
            getSearchText(
                order,
                index
            );


        if (
            searchValue === "" ||
            searchableText.includes(searchValue)
        ) {

            html +=
                buildOrderHtml(
                    order,
                    index
                );

            count++;

        }

    });


    if (count === 0) {

        ordersContainer.innerHTML = `

            <div class="col-12">

                <div class="alert alert-light
                            text-center
                            shadow-sm
                            empty-orders
                            p-5">

                    <div style="font-size:60px;">
                        📦
                    </div>


                    <h4 class="mt-3">
                        No Orders Found
                    </h4>


                    <p class="text-muted mb-0">
                        Orders placed from Checkout
                        will appear here.
                    </p>

                </div>

            </div>

        `;

    }
    else {

        ordersContainer.innerHTML =
            html;

    }


    resultCount.textContent =
        count +
        (
            count === 1
                ? " Order"
                : " Orders"
        );


    attachOrderEvents();

}


/* =====================================================
   STATUS CHANGE + DELETE
===================================================== */

function attachOrderEvents() {


    /* ---------------------------------------------
       STATUS CHANGE
    --------------------------------------------- */

    const statusSelects =
        document.querySelectorAll(
            ".status-select"
        );


    statusSelects.forEach(function(select) {

        select.addEventListener(
            "change",
            function() {

                const index =
                    Number(
                        this.dataset.index
                    );


                if (
                    Number.isNaN(index) ||
                    !allOrders[index]
                ) {

                    return;

                }


                const newStatus =
                    normalizeStatus(
                        this.value
                    );


                allOrders[index].status =
                    newStatus;


                saveOrders();

                updateDashboard();

                displayOrders();

            }
        );

    });


    /* ---------------------------------------------
       DELETE ORDER
    --------------------------------------------- */

    const deleteButtons =
        document.querySelectorAll(
            ".delete-order"
        );


    deleteButtons.forEach(function(button) {

        button.addEventListener(
            "click",
            function() {

                const index =
                    Number(
                        this.dataset.index
                    );


                if (
                    Number.isNaN(index) ||
                    !allOrders[index]
                ) {

                    return;

                }


                const customerName =
                    safeString(
                        allOrders[index].customerName
                    );


                const message =
                    customerName
                        ? "Are you sure you want to delete the order of " +
                          customerName +
                          "?"
                        : "Are you sure you want to delete this order?";


                const confirmed =
                    window.confirm(
                        message
                    );


                if (!confirmed) {

                    return;

                }


                allOrders.splice(
                    index,
                    1
                );


                saveOrders();

                updateDashboard();

                displayOrders();

            }
        );

    });

}


/* =====================================================
   SEARCH EVENT
===================================================== */

if (searchInput) {

    searchInput.addEventListener(
        "input",
        function() {

            displayOrders();

        }
    );

}


/* =====================================================
   INITIALIZE DASHBOARD
===================================================== */

function initializeDashboard() {

    loadOrders();

    updateDashboard();

    displayOrders();

}


/* =====================================================
   START DASHBOARD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        initializeDashboard();

    }
);

</script>


</body>
