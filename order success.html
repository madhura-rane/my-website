<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Placed - LoopWhimsy</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ===============================
     NAVBAR
     =============================== -->

<nav class="navbar navbar-light bg-light shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-danger"
            href="index.html">

            LoopWhimsy

        </a>

    </div>

</nav>



<!-- ===============================
     ORDER SUCCESS
     =============================== -->

<section class="container py-5">

    <div
        class="card shadow-sm p-5 mx-auto text-center"
        style="max-width: 650px;">

        <!-- Success Emoji -->

        <div
            style="
                font-size:90px;
                animation:bounce 1s infinite;
            ">

            🎉

        </div>


        <!-- Heading -->

        <h1
            class="text-danger fw-bold mt-3">

            Order Placed!

        </h1>


        <h4 class="mt-3">

            Your order has been placed successfully 🎊

        </h4>


        <p class="text-muted mt-3">

            Thank you for shopping with LoopWhimsy ❤️

        </p>


        <!-- Success Alert -->

        <div
            class="alert alert-success mt-4">

            ✅ Your order has been received
            successfully!

        </div>


        <!-- Continue Shopping -->

        <a
            href="index.html"
            class="btn btn-danger mt-3">

            Continue Shopping 🛍️

        </a>

    </div>

</section>



<!-- ===============================
     CONFETTI / FATAKA
     =============================== -->

<script>


const confettiContainer =
    document.createElement("div");


confettiContainer.style.position =
    "fixed";

confettiContainer.style.top =
    "0";

confettiContainer.style.left =
    "0";

confettiContainer.style.width =
    "100%";

confettiContainer.style.height =
    "100%";

confettiContainer.style.pointerEvents =
    "none";

confettiContainer.style.zIndex =
    "9999";


document.body.appendChild(
    confettiContainer
);



// Create 150 confetti pieces

for (let i = 0; i < 150; i++) {


    const confetti =
        document.createElement("div");


    confetti.style.position =
        "absolute";


    confetti.style.width =
        "10px";


    confetti.style.height =
        "10px";


    confetti.style.background =
        [
            "#dc3545",
            "#ffc107",
            "#198754",
            "#0d6efd",
            "#6f42c1",
            "#fd7e14"
        ][
            Math.floor(
                Math.random() * 6
            )
        ];


    confetti.style.left =
        Math.random() * 100 + "%";


    confetti.style.top =
        "-20px";


    confetti.style.borderRadius =
        "3px";


    confetti.style.transform =
        "rotate(" +
        Math.random() * 360 +
        "deg)";


    confettiContainer.appendChild(
        confetti
    );



    const fallDistance =
        100 +
        Math.random() * 100;


    const duration =
        2000 +
        Math.random() * 2500;



    confetti.animate(

        [

            {
                transform:
                    "translateY(0) rotate(0deg)",

                opacity: 1

            },

            {
                transform:
                    "translateY(" +
                    fallDistance +
                    "vh) rotate(720deg)",

                opacity: 0

            }

        ],

        {

            duration:
                duration,

            easing:
                "ease-out",

            fill:
                "forwards"

        }

    );

}

</script>



<!-- ===============================
     BOUNCE ANIMATION
     =============================== -->

<style>

@keyframes bounce {

    0%, 100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-15px);

    }

}

</style>


</body>

</html>
